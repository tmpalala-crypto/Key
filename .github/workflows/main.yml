name: Build APK
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
      - run: cd Key && flutter create . --project-name key --platforms=android
      - run: cd Key && flutter pub get
      - run: cd Key && flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: APK
          path: Key/build/app/outputs/flutter-apk/app-release.apk
